name: tests

on:
  push:
  pull_request:

jobs:
  checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shipped personas pass the checker
        run: for f in output/persona-*.md; do python check_persona.py "$f"; done
      - name: Demo page builds
        run: python build_demo.py
